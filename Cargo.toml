[package]
name = "acpbot"
version = "0.1.0"
edition = "2024"
description = "Chat bot that forwards platform events to an ACP agent and lets the agent speak through MCP tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexoliu/acpbot"
readme = "README.md"
keywords = ["acp", "telegram", "chatbot", "agent"]
categories = ["command-line-utilities"]

[dependencies]
aither-core = { path = "../aither/core", version = "0.4" }
aither-mcp = { path = "../aither/mcp", version = "0.4" }
aither-acp = { path = "../aither/acp", version = "0.4" }
botkit-core = { path = "../botkit/core", version = "0.2" }
botkit-telegram = { path = "../botkit/telegram", version = "0.2" }
botkit-cli = { path = "../botkit/cli", version = "0.1" }
botkit-discord = { path = "../botkit/discord", version = "0.2" }
heel = { path = "../native-sandbox", version = "0.3", default-features = false }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"

futures-lite = "2.6"
async-channel = "2"
async-io = "2.6"
async-lock = "3"
async-fs = "2.2"
async-net = "2.0"
executor-core = "0.7.1"
async-executor = "1.14"
dirs = "6"
base64 = "0.22"
ctrlc = { version = "3.5", features = ["termination"] }
mime_guess = "2.0.5"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jiff = "0.2.37"
async-process = "2"
async-tungstenite = { version = "0.31", default-features = false, features = ["handshake", "futures-03-sink"] }
zenwave = "0.5"
linkify = "0.11.0"
tl = "0.7.8"
html-escape = "0.2.15"
url = "2.5.8"
