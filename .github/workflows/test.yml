name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: acpbot
      # Path deps resolve against sibling checkouts.
      - uses: actions/checkout@v4
        with:
          repository: lexoliu/aither
          path: aither
      - uses: actions/checkout@v4
        with:
          repository: lexoliu/botkit
          path: botkit
      - uses: actions/checkout@v4
        with:
          repository: lexoliu/heel
          path: native-sandbox
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: acpbot
          shared-key: test-${{ matrix.os }}
      - run: cargo test --verbose --all-features
        working-directory: acpbot
